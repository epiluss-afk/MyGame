<!DOCTYPE html>\n<html lang='ko'>\n<head>\n<meta charset='UTF-8'>\n<title>MyGame</title>\n<style>\n body{margin:0;overflow:hidden;background:#111;}\n #hud{position:absolute;top:10px;left:10px;color:#fff;font-family:sans-serif;}\n</style>\n<script src='https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js'></script>\n</head>\n<body>\n<div id='hud'>FPS: <span id='fps'>0</span> | HP: <span id='hp'>100</span></div>\n<canvas id='glcanvas'></canvas>\n<script>\n// Scene\nconst canvas = document.getElementById('glcanvas');\nconst renderer = new THREE.WebGLRenderer({ canvas, antialias: true });\nrenderer.setSize(window.innerWidth, window.innerHeight);\nrenderer.setPixelRatio(window.devicePixelRatio);\n\nconst scene = new THREE.Scene();\nscene.fog = new THREE.Fog(0x111111, 20, 100);\n\n// Lights\nconst hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 2.0);\nhemi.intensity = 2.0;\nscene.add(hemi);\nconst amb = new THREE.AmbientLight(0xffffff, 0.3);\nscene.add(amb);\n\n// Camera\nconst camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 200);\ncamera.position.set(0, 6, 12);\nconst cameraOffset = new THREE.Vector3(0, 5, 10);\n\n// Player\nconst playerGeo = new THREE.BoxGeometry(1, 2, 1);\nconst playerMat = new THREE.MeshStandardMaterial({ color: 0x00aaee });\nconst player = new THREE.Mesh(playerGeo, playerMat);\nplayer.position.set(0, 1, 0);\nplayer.castShadow = true;\nscene.add(player);\n\n// Floor\nconst floorGeo = new THREE.PlaneGeometry(200, 200);\nconst floorMat = new THREE.MeshStandardMaterial({ color: 0x555555 });\nconst floor = new THREE.Mesh(floorGeo, floorMat);\nfloor.rotation.x = - Math.PI / 2;\nfloor.receiveShadow = true;\nscene.add(floor);\n\n// Obstacles\nconst blockGeo = new THREE.BoxGeometry(1, 1, 1);\nconst blockMat = new THREE.MeshStandardMaterial({ color: 0x777777 });\nconst blocks = [];\nfor (let i = -5; i <= 5; i++) {\n  for (let j = -5; j <= 5; j++) {\n    if (Math.random() < 0.2) {\n      const block = new THREE.Mesh(blockGeo, blockMat);\n      block.position.set(i, 0.5, j);\n      block.castShadow = true;\n      block.receiveShadow = true;\n      scene.add(block);\n      blocks.push(block);\n    }\n  }\n}\nconst blockRadius = Math.sqrt(0.5 * 0.5 * 3);\n\n// Movement\nconst keys = {};\ndocument.addEventListener('keydown', (e) => { keys[e.code] = true; });\ndocument.addEventListener('keyup', (e) => { keys[e.code] = false; });\n\nconst moveSpeed = 6;\nconst playerRadius = 1.5;\nconst minX = -50, maxX = 50, minZ = -50, maxZ = 50;\n\n// FPS\nconst fpsEl = document.getElementById('fps');\nlet fpsTime = 0, fpsCount = 0;\n\n// Resize\nwindow.addEventListener('resize', () => {\n  camera.aspect = window.innerWidth / window.innerHeight;\n  camera.updateProjectionMatrix();\n  renderer.setSize(window.innerWidth, window.innerHeight);\n});\n\n// Animation loop\nlet lastTime = 0;\nfunction animate(time) {\n  const delta = (time - lastTime) / 1000;\n  lastTime = time;\n  \n  // Movement vector\n  const dir = new THREE.Vector3();\n  if (keys['KeyW']) dir.z -= 1;\n  if (keys['KeyS']) dir.z += 1;\n  if (keys['KeyA']) dir.x -= 1;\n  if (keys['KeyD']) dir.x += 1;\n  if (dir.lengthSq() > 0) {\n    dir.normalize();\n    const next = player.position.clone().addScaledVector(dir, moveSpeed * delta);\n    let blocked = false;\n    if (next.x < minX || next.x > maxX || next.z < minZ || next.z > maxZ) blocked = true;\n    for (const block of blocks) {\n      if (next.distanceTo(block.position) < playerRadius + blockRadius) {\n        blocked = true;\n        break;\n      }\n    }\n    if (!blocked) player.position.copy(next);\n  }\n  \n  // Camera follow\n  const targetCamPos = player.position.clone().add(cameraOffset);\n  camera.position.lerp(targetCamPos, 0.1);\n  camera.lookAt(player.position);\n  \n  // FPS update\n  fpsTime += delta; fpsCount++;\n  if (fpsTime >= 1) { fpsEl.textContent = fpsCount; fpsTime = 0; fpsCount = 0; }\n  \n  renderer.render(scene, camera);\n  requestAnimationFrame(animate);\n}\nrequestAnimationFrame(animate);\n</script>\n<script>
// Weapon, aiming and bullet system for Phase 2
// This logic extends the existing Three.js scene created earlier.

// ---------- Aiming -----------------
const mouse = new THREE.Vector2();
const raycaster = new THREE.Raycaster();
const gravityPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

function onMouseMove(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersection = new THREE.Vector3();
  raycaster.ray.intersectPlane(gravityPlane, intersection);
  if (intersection) {
    const dir = intersection.clone().sub(player.position).normalize();
    aimDirection = dir;
    const angle = Math.atan2(dir.x, dir.z);
    player.rotation.y = angle;
  }
}
document.addEventListener('mousemove', onMouseMove, false);

// ---------- Weapon and firing -----------------
const fireRate = 5;
const fireCooldownTime = 1 / fireRate;
let fireCooldown = 0;
const baseDamage = 20;
let mouseDown = false;

const bulletGeom = new THREE.SphereGeometry(0.1, 8, 8);
const bulletMat = new THREE.MeshStandardMaterial({ color: 0xffff00 });
const bullets = [];

const targetGeom = new THREE.BoxGeometry(1, 1, 1);
const targetMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
const targets = [];

for (let i = 0; i < 5; i++) {
  const pos = new THREE.Vector3(i * 3 - 6, 0.5, -10);
  const mesh = new THREE.Mesh(targetGeom, targetMat.clone());
  mesh.position.copy(pos);
  mesh.userData = { hp: 100, maxHp: 100 };
  scene.add(mesh);
  targets.push(mesh);
}

function createMuzzleFlash(position) {
  const flashGeom = new THREE.SphereGeometry(0.2, 8, 8);
  const flashMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const flashMesh = new THREE.Mesh(flashGeom, flashMat);
  flashMesh.position.copy(position);
  scene.add(flashMesh);
  setTimeout(() => { scene.remove(flashMesh); }, 50);
}
document.addEventListener('mousedown', (e) => { if (e.button === 0) mouseDown = true; }, false);
document.addEventListener('mouseup', (e) => { if (e.button === 0) mouseDown = false; }, false);

function fire(direction, damage = baseDamage, options = {}) {
  const forward = direction.clone();
  const muzzleOffset = forward.clone().multiplyScalar(1.0);
  const muzzlePos = player.position.clone().add(new THREE.Vector3(0, 1, 0)).add(muzzleOffset);
  const bulletMesh = new THREE.Mesh(bulletGeom, bulletMat);
  bulletMesh.position.copy(muzzlePos);
  scene.add(bulletMesh);
  bullets.push({mesh: bulletMesh, direction: forward, speed: 30, damage: damage, lifetime: 3, created: performance.now() / 1000, maxPierce: options.maxPierce || 0, hitEnemies: [], pierceCount: 0});
  createMuzzleFlash(muzzlePos);
}

let aimDirection = new THREE.Vector3(0, 0, 1);

function updateBullets(delta) {
  const now = performance.now() / 1000;
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.mesh.position.add(b.direction.clone().multiplyScalar(b.speed * delta));
    if (now - b.created > b.lifetime) { scene.remove(b.mesh); bullets.splice(i, 1); continue; }
    for (let j = targets.length - 1; j >= 0; j--) {
      const t = targets[j];
      const dist = b.mesh.position.distanceTo(t.position);
      if (dist < 0.6) {
        t.userData.hp -= b.damage;
        const originalColor = t.material.color.clone();
        t.material.color.set(0xffff00);
        setTimeout(() => { t.material.color.copy(originalColor); }, 100);
        scene.remove(b.mesh);
        bullets.splice(i, 1);
        if (t.userData.hp <= 0) { scene.remove(t); targets.splice(j, 1); }
        break;
      }
    }
  }
}

let lastTime = 0;
function animate(time) {
  const delta = (time - lastTime) / 1000;
  lastTime = time;
  const dir = new THREE.Vector3();
  if (keys['KeyW']) dir.z -= 1;
  if (keys['KeyS']) dir.z += 1;
  if (keys['KeyA']) dir.x -= 1;
  if (keys['KeyD']) dir.x += 1;
  if (dir.lengthSq() > 0) {
    dir.normalize();
    const next = player.position.clone().addScaledVector(dir, moveSpeed * delta);
    let blocked = false;
    if (next.x < minX || next.x > maxX || next.z < minZ || next.z > maxZ) blocked = true;
    for (const block of blocks) {
      if (next.distanceTo(block.position) < playerRadius + blockRadius) { blocked = true; break; }
    }
    if (!blocked) player.position.copy(next);
  }
  const targetCamPos = player.position.clone().add(cameraOffset);
  camera.position.lerp(targetCamPos, 0.1);
  camera.lookAt(player.position);
  fpsTime += delta; fpsCount++;
  if (fpsTime >= 1) { fpsEl.textContent = fpsCount; fpsTime = 0; fpsCount = 0; }
  updateBullets(delta);
  if (mouseDown) {
    fireCooldown -= delta;
    if (fireCooldown <= 0) { fire(); fireCooldown = fireCooldownTime; }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
lastTime = performance.now();
requestAnimationFrame(animate);
</script>
</body>\n</html>
